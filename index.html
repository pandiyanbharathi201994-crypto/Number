
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .calculator {
            width: 400px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            text-align: center;
        }

        .calculator h1 {
            color: #333;
            margin-bottom: 8px;
        }

        .calculator p {
            color: #777;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            text-align: left;

            margin-bottom: 7px;

            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 2px solid #ddd;

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;

            box-shadow:
                0 0 8px rgba(102, 126, 234, 0.3);
        }

        .buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 20px;
        }

        button {
            padding: 14px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .add {
            background: #28a745;
        }

        .subtract {
            background: #ff9800;
        }

        .multiply {
            background: #2196f3;
        }

        .divide {
            background: #e91e63;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 8px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.96);
        }

        .result-box {
            margin-top: 25px;

            padding: 20px;

            background: #f5f5f5;

            border-radius: 15px;

           
        }

        .result-title {
            color: #777;

            font-size: 14px;

            margin-bottom: 8px;
        }

        #result {
            font-size: 28px;

            font-weight: bold;

            color: #333;
        }

        .clear {
            width: 100%;

            margin-top: 15px;

            background: #333;
        }

        .clear:hover {
            background: #111;
        }

        @media (max-width: 450px) {

            .calculator {
                width: 90%;

                padding: 25px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <div class="calculator">

        <h1>🧮 Smart Calculator</h1>

        <p>Add • Subtract • Multiply • Divide</p>


        <div class="input-box">

            <label>First Number</label>

            <input
                type="number"
                id="num1"
                placeholder="Enter first number"
            >

        </div>


        <div class="input-box">

            <label>Second Number</label>

            <input
                type="number"
                id="num2"
                placeholder="Enter second number"
            >

        </div>


        <div class="buttons">

            <button class="add" onclick="addNumbers()">
                ➕ Add
            </button>

            <button class="subtract" onclick="subtractNumbers()">
                ➖ Subtract
            </button>

            <button class="multiply" onclick="multiplyNumbers()">
                ✖ Multiply
            </button>

            <button class="divide" onclick="divideNumbers()">
                ➗ Divide
            </button>

        </div>


        <div class="result-box">

            <div class="result-title">
                RESULT
            </div>

            <div id="result">
                0
            </div>

        </div>


        <button class="clear" onclick="clearCalculator()">
            🗑 Clear
        </button>

    </div>


    <script>

        function getNumbers() {

            let num1 = Number(
                document.getElementById("num1").value
            );

            let num2 = Number(
                document.getElementById("num2").value
            );

            return [num1, num2];
        }


        function addNumbers() {

            let [num1, num2] = getNumbers();

            let result = num1 + num2;

            document.getElementById("result").innerHTML =
                result;
        }


        function subtractNumbers() {

            let [num1, num2] = getNumbers();

            let result = num1 - num2;

            document.getElementById("result").innerHTML =
                result;
        }


        function multiplyNumbers() {

            let [num1, num2] = getNumbers();

            let result = num1 * num2;

            document.getElementById("result").innerHTML =
                result;
        }


        function divideNumbers() {

            let [num1, num2] = getNumbers();

            if (num2 === 0) {

                document.getElementById("result").innerHTML =
                    "Cannot divide by 0";

                return;
            }

            let result = num1 / num2;

            document.getElementById("result").innerHTML =
                result;
        }


        function clearCalculator() {

            document.getElementById("num1").value = "";

            document.getElementById("num2").value = "";

            document.getElementById("result").innerHTML = "0";
        }

    </script>


</body>

</html>
